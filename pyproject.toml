[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-agent-delegation-mvp"
version = "0.1.0"
description = "Independent LangGraph / A2A / official EVE MCP delegation demonstrator"
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.14", "langgraph-checkpoint-sqlite==3.1.1",
  "a2a-sdk[http-server]==0.3.25", "mcp[cli]==1.27.0",
  "fastapi==0.135.4", "uvicorn==0.42.0", "httpx==0.28.1",
  "python-dotenv==1.2.2", "requests==2.32.5", "pystac==1.14.3",
  "pyarrow==23.0.1", "langchain-openai==1.1.11",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.0", "mypy==2.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["vendor", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/eve_demo"]
ignore_missing_imports = true
check_untyped_defs = true

